<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17232f">
<title>KissUZ — Spin the Bottle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--wood1:#e5a04e;--wood2:#bd7130;--wood3:#8e4c20;--cream:#ffe1a2}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#17232f}
body{overscroll-behavior:none}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:#17232f}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .35s ease}
.screen.active{opacity:1;visibility:visible}
#loading,#logo{background-color:#7d9e4b;background-image:
radial-gradient(circle at 12% 15%,transparent 0 6px,#91b65b 7px 9px,transparent 10px),
radial-gradient(circle at 78% 28%,transparent 0 8px,#91b65b 9px 11px,transparent 12px),
radial-gradient(circle at 35% 75%,transparent 0 5px,#91b65b 6px 8px,transparent 9px),
radial-gradient(circle at 85% 82%,transparent 0 4px,#91b65b 5px 7px,transparent 8px),
linear-gradient(135deg,#789746,#85a653 55%,#729044)}
.pattern{position:absolute;inset:-20px;opacity:.18;background-image:
radial-gradient(ellipse at center,transparent 44%,#b4d06c 46% 53%,transparent 55%);
background-size:118px 126px;transform:rotate(17deg)}
.doodles{position:absolute;inset:0;opacity:.16;color:#b8d66d;font-size:43px;line-height:1}
.doodles span{position:absolute;transform:rotate(-13deg)}
.doodles span:nth-child(1){left:8%;top:8%}.doodles span:nth-child(2){left:55%;top:5%}
.doodles span:nth-child(3){left:78%;top:22%}.doodles span:nth-child(4){left:20%;top:33%}
.doodles span:nth-child(5){left:66%;top:49%}.doodles span:nth-child(6){left:5%;top:67%}
.doodles span:nth-child(7){left:43%;top:78%}.doodles span:nth-child(8){left:82%;top:87%}
.progress{width:52%;height:34px;border-radius:30px;background:#fff;padding:6px;box-shadow:0 2px 6px #526b32;overflow:hidden}
.progress i{display:block;width:0;height:100%;border-radius:20px;background:linear-gradient(#c4e86d,#91c33d);animation:load 1.8s ease forwards}
@keyframes load{to{width:100%}}
.logo{color:#ff9d18;text-align:center;font-weight:1000;font-style:italic;line-height:.83;letter-spacing:1px;text-shadow:2px 4px 0 #a94e14,4px 7px 5px #394b24;transform:rotate(-2deg);animation:logoIn .65s cubic-bezier(.2,1.5,.4,1) both}
.logo strong{display:block;font-size:clamp(68px,19vw,112px);letter-spacing:3px}
.logo small{display:block;font-size:clamp(37px,10vw,58px);margin-top:10px;letter-spacing:-1px}
@keyframes logoIn{from{transform:scale(.45) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(-2deg);opacity:1}}
#tableScreen{display:block;background:#fff}
.gameboard{position:absolute;left:0;right:0;top:0;height:59%;overflow:hidden;background:#b76c2c}
.wood{position:absolute;inset:0;background:
radial-gradient(ellipse at 50% 45%,rgba(255,211,130,.32),transparent 55%),
repeating-linear-gradient(2deg,transparent 0 17px,rgba(103,48,13,.10) 18px,transparent 20px 34px),
repeating-linear-gradient(91deg,rgba(255,220,150,.07) 0 2px,transparent 3px 95px),
linear-gradient(105deg,#c27a36,#e2a454 30%,#c9823c 66%,#a95f28)}
.wood:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(74,35,11,.18),transparent 15%,transparent 85%,rgba(74,35,11,.18))}
.topbar{height:58px;position:absolute;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-around;padding:5px 8px;background:linear-gradient(#bd7535,#a95f28);box-shadow:0 2px 5px #75401f66;color:#fff4d9}
.topbtn{width:31px;height:31px;flex:0 0 31px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#e8a957,#c77b35);box-shadow:0 2px 4px #713e20aa,inset 0 1px 2px #ffdfa2;font-size:24px;text-shadow:0 1px 2px #88501f}
.heart{font-size:35px;color:#fff;filter:drop-shadow(1px 2px 1px #9c4926)}
.score{font-size:13px;font-weight:bold;margin-left:-8px}
.streak{font-size:9px;text-align:center;background:#fff;color:#777;border-radius:12px;padding:3px 8px;margin-top:-3px}
.tablecount{text-align:center;font-size:12px;line-height:15px;font-weight:bold}
.tablecount b{font-size:14px}
.seats{position:absolute;inset:66px 0 28px;z-index:2;overflow:visible}
.seat{position:absolute;width:16%;height:auto;min-height:0;max-height:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:visible}
.avatar{display:block;width:100%;height:auto;aspect-ratio:1/1;max-height:none;min-height:0;flex:0 0 auto;position:relative;border-radius:9px;overflow:hidden;border:2px solid rgba(255,222,157,.65);background:linear-gradient(145deg,#27394b,#111b26);box-shadow:0 3px 7px #5c2e1680}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .initial{height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;color:#ffe0a2;background:linear-gradient(135deg,#4c6070,#17232f)}
.level{position:absolute;right:-3px;top:-4px;z-index:2;background:#e74d36;color:#fff;border-radius:12px;padding:3px 6px;font-size:11px;font-weight:bold;border:1px solid #ffbd82}
.playername{display:block;width:100%;max-width:125px;white-space:nowrap;overflow:visible;text-overflow:clip;color:#fff8e9;font-size:12px;line-height:17px;text-align:center;text-shadow:0 1px 3px #552b12;margin-top:4px}
.gift{position:absolute;right:-8px;bottom:15px;font-size:24px;filter:drop-shadow(0 1px 2px #6d371b)}
.s1{left:1%;top:1%}.s2{left:25%;top:1%}.s3{left:49%;top:1%}.s4{left:73%;top:1%}
.s5{left:2%;top:30%;width:16%}.s6{left:2%;top:56%;width:16%}
.s7{right:2%;top:30%;width:16%}.s8{right:2%;top:56%;width:16%}
.s9{left:1%;top:78%}.s10{left:25%;top:78%}.s11{left:49%;top:78%}.s12{left:73%;top:78%}
.centerornament{position:absolute;z-index:1;width:min(45vw,245px);height:min(45vw,245px);left:50%;top:50%;transform:translate(-50%,-50%);opacity:.45}
.bottlewrap{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:126px;display:flex;align-items:center;justify-content:center}
.bottle{width:48px;height:122px;filter:drop-shadow(5px 6px 4px #603b1b88)}
.spincaption{position:absolute;z-index:3;left:30%;top:43%;color:#fff;text-shadow:0 1px 3px #75401f;font-size:14px;line-height:16px;text-align:center}
.chatpanel{position:absolute;left:0;right:0;top:59%;bottom:0;background:#f4f4f4;display:flex;flex-direction:column;z-index:6}
.messages{flex:1;min-height:0;overflow:hidden;padding:10px 12px 6px;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;background:#f5f5f5}
.message{align-self:flex-start;max-width:86%;background:#fff;border-radius:11px;padding:9px 13px;color:#171717;font-size:14px;line-height:19px;box-shadow:0 1px 1px #00000008}
.chatname{font-weight:700;color:#555}.chatname.blue{color:#43a9df}.chatname.pink{color:#e27cae}
.bottomchat{position:relative;z-index:6;flex:0 0 58px;left:0;right:0;height:58px;background:#fff;display:flex;align-items:center;padding:0 13px;gap:10px;box-shadow:0 -1px 4px #00000012}
.bottomchat .placeholder{flex:1;color:#aaa;font-size:16px}
.send{width:38px;height:38px;border-radius:50%;background:#f4ad4b;color:white;display:flex;align-items:center;justify-content:center;font-size:22px}
@media(max-height:650px){.topbar{height:52px}.seats{inset:60px 0 24px}.playername{font-size:11px;line-height:15px}.gameboard{height:59%}.chatpanel{top:59%}.bottomchat{flex-basis:50px;height:50px}}
</style>
</head>
<body>
<div id="app">
  <section id="loading" class="screen active">
    <div class="pattern"></div><div class="doodles"><span>♡</span><span>♬</span><span>♛</span><span>♧</span><span>♙</span><span>♬</span><span>♡</span><span>♛</span></div>
    <div class="progress"><i></i></div>
  </section>
  <section id="logo" class="screen">
    <div class="pattern"></div><div class="doodles"><span>♡</span><span>♬</span><span>♛</span><span>♧</span><span>♙</span><span>♬</span><span>♡</span><span>♛</span></div>
    <div class="logo"><strong>SPIN</strong><small>the Bottle</small></div>
  </section>
  <section id="tableScreen" class="screen">
    <div class="gameboard">
    <div class="wood"></div>
    <div class="topbar">
      <div class="heart">♡</div><div class="score">0</div>
      <div class="topbtn">✧<div class="streak" style="position:absolute;top:49px">14d</div></div>
      <div class="topbtn">◉</div>
      <div class="topbtn" style="font-size:15px">#20<div class="streak" style="position:absolute;top:49px">22h</div></div>
      <div class="topbtn">☰</div><div class="topbtn">⚙</div>
      <div class="tablecount">Table<br><b>40</b></div><div class="topbtn">7</div>
    </div>
    <svg class="centerornament" viewBox="0 0 300 300" aria-hidden="true">
      <path d="M150 8 C170 42 190 48 224 34 C211 68 232 89 270 92 C241 116 242 142 292 150 C242 165 241 190 270 214 C230 216 211 238 224 270 C190 254 170 262 150 292 C130 262 110 254 76 270 C89 238 70 216 30 214 C59 190 58 165 8 150 C58 142 59 116 30 92 C68 89 89 68 76 34 C110 48 130 42 150 8Z" fill="#f5c16e" fill-opacity=".12" stroke="#8f4f20" stroke-width="5"/>
      <path d="M150 30 C168 68 199 83 238 75 C218 111 232 135 270 150 C232 165 218 189 238 225 C199 217 168 232 150 270 C132 232 101 217 62 225 C82 189 68 165 30 150 C68 135 82 111 62 75 C101 83 132 68 150 30Z" fill="none" stroke="#f5c16e" stroke-width="7"/>
      <circle cx="150" cy="150" r="95" fill="none" stroke="#8f4f20" stroke-width="3"/>
    </svg>
    <div class="spincaption">Spins<br>the bottle</div>
    <div class="bottlewrap">
      <svg class="bottle" viewBox="0 0 100 260" aria-label="Green bottle">
        <defs><linearGradient id="glass" x1="0" x2="1"><stop stop-color="#0d6a16"/><stop offset=".22" stop-color="#4bc52b"/><stop offset=".48" stop-color="#9bea43"/><stop offset=".72" stop-color="#238b18"/><stop offset="1" stop-color="#064d13"/></linearGradient><linearGradient id="neck" x1="0" x2="1"><stop stop-color="#075a12"/><stop offset=".5" stop-color="#8fe63a"/><stop offset="1" stop-color="#06450e"/></linearGradient></defs>
        <path d="M40 8 Q40 3 50 3 Q60 3 60 8 L60 35 Q60 43 68 51 Q78 62 78 79 L78 225 Q78 245 61 250 L39 250 Q22 245 22 225 L22 79 Q22 62 32 51 Q40 43 40 35Z" fill="url(#glass)" stroke="#145b12" stroke-width="3"/>
        <path d="M40 7 L60 7 L60 37 L40 37Z" fill="url(#neck)"/><path d="M38 3 L62 3 L62 12 L38 12Z" fill="#174f10" stroke="#b1ed56" stroke-width="1"/>
        <path d="M31 72 Q27 91 29 220 Q30 237 38 240" fill="none" stroke="#c4ff6c" stroke-width="5" opacity=".65" stroke-linecap="round"/>
        <path d="M70 80 Q74 100 71 220" fill="none" stroke="#06490d" stroke-width="4" opacity=".5"/>
        <path d="M26 225 Q50 210 74 225" fill="none" stroke="#0a5610" stroke-width="7" opacity=".65"/>
      </svg>
    </div>
    <div class="seats" id="seats"></div>
    </div>
    <div class="chatpanel">
      <div class="messages">
        <div class="message"><span class="chatname blue">No name [1]:</span> yahw rahmat ozizc</div>
        <div class="message"><span class="chatname pink">No name [1]:</span> Kim 1/1 oynedi</div>
        <div class="message"><span class="chatname blue">Ismoil:</span> Kim 1/1 oynedi</div>
        <div class="message"><span class="chatname">No name [1]:</span> yaxshi rahmat nima gap</div>
      </div>
      <div class="bottomchat"><div class="placeholder">Write a message here</div><div class="send">➤</div></div>
    </div>
  </section>
</div>
<script>
(function(){
 const tg=window.Telegram&&window.Telegram.WebApp;
 if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#17232f');tg.setBackgroundColor('#17232f')}catch(e){}}
 const screens=['loading','logo','tableScreen'];
 function show(id){screens.forEach(s=>document.getElementById(s).classList.toggle('active',s===id))}
 setTimeout(()=>{show('logo');setTimeout(()=>show('tableScreen'),1900)},2100);
 const positions=['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12'];
 const levels=[6,2,42,5,8,2,17,5,2,14,3,125];
 const seats=document.getElementById('seats');
 positions.forEach((p,i)=>{
  const el=document.createElement('div');el.className='seat '+p;
  const av=document.createElement('div');av.className='avatar';
  const init=document.createElement('div');init.className='initial';init.textContent='👤';av.appendChild(init);
  const level=document.createElement('span');level.className='level';level.textContent=String(levels[i]);av.appendChild(level);
  const gift=document.createElement('div');gift.className='gift';gift.textContent='🍸';
  const name=document.createElement('div');name.className='playername';name.textContent='No name, 22';
  el.append(av,gift,name);seats.appendChild(el);
 });
})();
</script>
</body>
</html>
