<script>
(function(){
 const tg=window.Telegram&&window.Telegram.WebApp;
 if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#17232f');tg.setBackgroundColor('#17232f')}catch(e){}}
 const screens=['loading','logo','tableScreen'];
 function show(id){screens.forEach(s=>document.getElementById(s).classList.toggle('active',s===id))}
 setTimeout(()=>{show('logo');setTimeout(()=>show('tableScreen'),1900)},2100);
 const positions=['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12'];
 const seats=document.getElementById('seats');
 positions.forEach((p,i)=>{
  const el=document.createElement('div');el.className='seat '+p;
  const av=document.createElement('div');av.className='avatar';
  const init=document.createElement('div');init.className='initial';init.textContent='👤';av.appendChild(init);
  const level=document.createElement('span');level.className='level';level.textContent=i===9?'125':String([6,2,42,8,17,2,5,2,14,125,3,7][i]);av.appendChild(level);
  const gift=document.createElement('div');gift.className='gift';gift.textContent='🍸';
  const name=document.createElement('div');name.className='playername';name.textContent='No name, 22';
  el.append(av,gift,name);seats.appendChild(el);
 });
 // A gift marker stays on its player until the player changes seat/table.
 window.KissUZGiveGift=function(seatIndex,emoji='🍸'){const seat=seats.children[seatIndex];if(!seat)return;const marker=seat.querySelector('.gift');marker.textContent=emoji;seat.classList.add('has-gift')};
 window.KissUZClearGift=function(seatIndex){const seat=seats.children[seatIndex];if(!seat)return;seat.classList.remove('has-gift')};
})();
</script>
