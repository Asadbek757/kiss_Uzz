<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a95b24">
<title>KissUZ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --wood1:#c77a37;--wood2:#a95722;--wood3:#e39a4e;
  --gold:#f4bd67;--gold2:#ffe0a0;--dark:#281d18;
  --stage-h:59.2dvh; --toolbar-h:6.5dvh;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#fff}
#app{height:100dvh;width:100%;display:flex;flex-direction:column;overflow:hidden;background:#f4f4f4}
#game{height:59.2dvh;min-height:390px;max-height:910px;flex:none;display:flex;flex-direction:column;position:relative;overflow:hidden;background:
  repeating-linear-gradient(0deg,transparent 0 48px,rgba(91,42,13,.10) 49px,transparent 52px),
  repeating-linear-gradient(90deg,transparent 0 74px,rgba(255,210,135,.10) 75px,transparent 78px),
  radial-gradient(ellipse at 50% 53%,#eeb36b 0%,#d98d46 48%,#b9682d 100%)}
#game:before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(3deg,transparent 0 115px,rgba(94,45,17,.10) 116px,transparent 120px),
  linear-gradient(90deg,rgba(92,43,15,.10),transparent 16%,transparent 84%,rgba(92,43,15,.10));pointer-events:none}
#toolbar{height:10.5%;min-height:56px;max-height:88px;flex:none;display:flex;align-items:center;justify-content:space-around;padding:0 2.2%;position:relative;z-index:5;background:rgba(151,75,28,.10);border:0;box-shadow:none}
.heart{font-size:clamp(28px,6vw,48px);font-weight:bold;color:white;text-shadow:0 2px 3px #a7431f;white-space:nowrap}
.heart small{font-size:clamp(12px,2.5vw,19px);vertical-align:middle}
.tool{width:clamp(36px,6.8vw,58px);height:clamp(36px,6.8vw,58px);border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#f5c16e,#d98531);border:2px solid rgba(255,225,163,.65);box-shadow:0 3px 7px rgba(87,42,14,.25),inset 0 1px 3px rgba(255,255,255,.55);color:#fff;font-size:clamp(18px,4vw,30px);text-shadow:0 1px 2px #a45b25}
.tool.hash{font-size:clamp(15px,3vw,23px);font-weight:bold}
.table-info{font-weight:bold;text-align:center;font-size:clamp(11px,2.4vw,18px);line-height:1.05;text-shadow:0 1px 2px #9c4c1d;white-space:nowrap}
.table-info b{display:block;font-size:1.15em;margin-top:3px}
.round{width:clamp(36px,6.8vw,58px);height:clamp(36px,6.8vw,58px);border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f7c36d,#d7832d);border:2px solid rgba(255,226,167,.65);font-size:clamp(21px,4vw,34px);box-shadow:0 3px 7px #9a4e20}
#table{position:relative;flex:1;min-height:0;z-index:1;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,rgba(255,196,112,.28),transparent 62%)}
#ornament{position:absolute;width:min(44vw,350px);height:auto;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.44;filter:drop-shadow(0 2px 1px rgba(117,58,22,.15))}
#bottle{position:absolute;width:min(9vw,72px);height: min(27vh,218px);left:50%;top:50%;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 5px rgba(50,67,12,.35));z-index:2}
#spin-label{position:absolute;left:29%;top:50%;transform:translate(-50%,-50%);font-size:clamp(11px,2.7vw,20px);line-height:1.15;text-align:center;text-shadow:0 1px 2px #9b5c2c;z-index:2}
.player{position:absolute;width:15.8%;max-width:126px;min-width:72px;transform:translate(-50%,-50%);text-align:center;z-index:3;display:flex;flex-direction:column;align-items:center}
.player .photo{width:100%;aspect-ratio:1/1;border-radius:13%;padding:5px;background:linear-gradient(145deg,#f6d18a,#a77b43);box-shadow:0 3px 8px rgba(74,38,15,.42);position:relative}
.player .photo:after{content:"";position:absolute;inset:5px;border:2px solid rgba(255,225,165,.55);border-radius:10%;pointer-events:none}
.avatar{width:100%;height:100%;border-radius:9%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#273e56,#17283c)}
.avatar svg{width:75%;height:85%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.player:nth-of-type(odd) .avatar{background:linear-gradient(145deg,#8b6655,#3d302e)}
.player:nth-of-type(3n) .avatar{background:linear-gradient(145deg,#5e747b,#263b49)}
.count{position:absolute;right:-7%;top:-7%;min-width:37%;height:34%;padding:0 5px;border-radius:30px;background:#ed4643;border:3px solid #f5d69b;box-shadow:0 2px 5px #70401e;color:#fff;font-weight:bold;font-size:clamp(14px,3.5vw,25px);display:grid;place-items:center;z-index:2}
.nick{font-size:clamp(10px,2.25vw,16px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:112%;margin-top:2px;padding-bottom:1px;text-shadow:0 1px 2px #75401f}
.p1{left:17%;top:18.4%}.p2{left:39%;top:13.2%}.p3{left:61%;top:13.2%}.p4{left:83%;top:18.4%}
.p5{left:13%;top:40.2%}.p6{left:13%;top:61.5%}.p7{left:87%;top:40.2%}.p8{left:87%;top:61.5%}
.p9{left:17%;top:79.5%}.p10{left:39%;top:83%}.p11{left:61%;top:83%}.p12{left:83%;top:79.5%}
#chat{flex:1;min-height:0;background:#f4f4f4;position:relative;overflow:auto}
#messages{padding:10px 12px}
#composer{height:7.2dvh;min-height:54px;max-height:78px;flex:none;background:#fff;border-top:1px solid #e5e5e5;display:flex;align-items:center;padding:0 3.5%;gap:9px}
#message{flex:1;min-width:0;border:0;outline:0;font-size:clamp(14px,2.8vw,18px);color:#333;background:transparent}
#message::placeholder{color:#bdbdbd}
#send{width:clamp(40px,7.5vw,54px);height:clamp(40px,7.5vw,54px);border:0;border-radius:50%;background:#f3b44e;color:white;font-size:clamp(21px,4vw,28px);display:grid;place-items:center;flex:none}
@media (max-height:650px){#game{height:62dvh}#composer{height:10dvh}.player{width:15.5%}#bottle{height:22vh}}
</style>
</head>
<body>
<div id="app">
  <section id="game">
    <div id="toolbar">
      <div class="heart">♡ <small>0</small></div>
      <div class="tool">✧</div><div class="tool">☼</div><div class="tool hash">#20</div>
      <div class="tool">☰</div><div class="tool">⚙</div>
      <div class="table-info">Table<b>40</b></div><div class="round">7</div>
    </div>
    <div id="table">
      <svg id="ornament" viewBox="0 0 400 400" aria-hidden="true">
        <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9d18a"/><stop offset="1" stop-color="#9e5c2c"/></linearGradient></defs>
        <path d="M200 8 C224 55 246 48 282 28 C278 73 300 91 350 91 C320 126 333 151 390 178 C342 196 342 224 390 252 C337 267 323 294 350 337 C300 330 274 348 282 390 C242 364 220 367 200 400 C180 367 158 364 118 390 C126 348 100 330 50 337 C77 294 63 267 10 252 C58 224 58 196 10 178 C67 151 80 126 50 91 C100 91 122 73 118 28 C154 48 176 55 200 8Z" fill="none" stroke="url(#gold)" stroke-width="5"/>
        <circle cx="200" cy="200" r="115" fill="none" stroke="#a76634" stroke-width="4"/>
        <circle cx="200" cy="200" r="94" fill="none" stroke="#f4d092" stroke-width="3"/>
      </svg>
      <div id="spin-label">Spins<br>the bottle</div>
      <svg id="bottle" viewBox="0 0 80 230" aria-hidden="true">
        <defs>
          <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#075c13"/><stop offset=".22" stop-color="#32e51a"/><stop offset=".48" stop-color="#8cff36"/><stop offset=".72" stop-color="#12a916"/><stop offset="1" stop-color="#064b10"/></linearGradient>
          <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#075b12"/><stop offset=".5" stop-color="#6fff2a"/><stop offset="1" stop-color="#075b12"/></linearGradient>
        </defs>
        <path d="M32 5h16v14H32z" fill="url(#neck)" stroke="#07500d" stroke-width="2"/>
        <path d="M32 19h16v31c0 11 5 17 12 28 6 9 8 17 8 29v103c0 13-9 18-28 18s-28-5-28-18V107c0-12 2-20 8-29 7-11 12-17 12-28z" fill="url(#glass)" stroke="#07580e" stroke-width="3"/>
        <path d="M25 96c-4 12-4 19-4 31v76c0 9 3 13 8 15" fill="none" stroke="#c5ff7b" stroke-width="4" opacity=".6"/>
        <path d="M19 194q21 14 43 0" fill="none" stroke="#064b0c" stroke-width="5"/>
      </svg>
      <div class="player p1"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#17283c"/></svg></div><span class="count">6</span></div><div class="nick">No name, 22</div></div>
      <div class="player p2"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#eee0c8"/></svg></div><span class="count">2</span></div><div class="nick">No name, 22</div></div>
      <div class="player p3"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#17283c"/></svg></div><span class="count">42</span></div><div class="nick">No name, 22</div></div>
      <div class="player p4"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#eee0c8"/></svg></div><span class="count">5</span></div><div class="nick">No name, 22</div></div>
      <div class="player p5"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#168bdc"/></svg></div><span class="count">8</span></div><div class="nick">No name, 22</div></div>
      <div class="player p6"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#17283c"/></svg></div><span class="count">17</span></div><div class="nick">No name, 22</div></div>
      <div class="player p7"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#17283c"/></svg></div><span class="count">2</span></div><div class="nick">No name, 22</div></div>
      <div class="player p8"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#17283c"/></svg></div><span class="count">2</span></div><div class="nick">No name, 22</div></div>
      <div class="player p9"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#17283c"/></svg></div><span class="count">14</span></div><div class="nick">No name, 22</div></div>
      <div class="player p10"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#17283c"/></svg></div><span class="count">125</span></div><div class="nick">No name, 22</div></div>
      <div class="player p11"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#253e53"/></svg></div><span class="count">3</span></div><div class="nick">No name, 22</div></div>
      <div class="player p12"><div class="photo"><div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="19" fill="#e6ad86"/><path d="M18 92V76q0-25 32-25t32 25v16" fill="#eee0c8"/></svg></div><span class="count">7</span></div><div class="nick">No name, 22</div></div>
    </div>
  </section>
  <section id="chat"><div id="messages"></div></section>
  <form id="composer"><input id="message" placeholder="Write a message here" autocomplete="off"><button id="send" type="submit">➤</button></form>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();document.body.style.backgroundColor='#f4f4f4';}
document.getElementById('composer').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('message');const value=input.value.trim();if(!value)return;const bubble=document.createElement('div');bubble.textContent=value;bubble.style.cssText='background:#fff;color:#222;border-radius:14px;padding:10px 14px;margin:7px 0 7px auto;width:fit-content;max-width:85%;font-size:15px;box-shadow:0 1px 2px #ddd';document.getElementById('messages').appendChild(bubble);input.value='';document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;});
</script>
</body>
</html>
