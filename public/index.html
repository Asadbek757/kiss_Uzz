<html lang="uz"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a85b25"><title>KissUZ</title>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:#f4f4f4;color:white}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#game{height:62dvh;min-height:420px;flex:none;display:flex;flex-direction:column;overflow:hidden;position:relative;
background:repeating-linear-gradient(0deg,transparent 0 48px,rgba(94,48,20,.09) 49px,transparent 52px),
repeating-linear-gradient(90deg,transparent 0 74px,rgba(255,219,160,.09) 75px,transparent 78px),
radial-gradient(ellipse at 50% 50%,#e9a75f 0%,#d88843 55%,#a95724 100%)}
#toolbar{height:11%;min-height:55px;max-height:88px;flex:none;display:flex;align-items:center;justify-content:space-around;padding:0 2%;position:relative;z-index:20;background:rgba(153,77,28,.14)}
.heart{font-size:clamp(27px,5.8vw,45px);white-space:nowrap;text-shadow:0 2px 3px #9b4a20}.heart small{font-size:13px}
.tool,.round{width:clamp(35px,6.6vw,54px);height:clamp(35px,6.6vw,54px);border-radius:50%;display:grid;place-items:center;flex:none;
background:linear-gradient(145deg,#f8c875,#d98936);border:2px solid rgba(255,224,165,.65);box-shadow:0 3px 6px #9c5527;font-size:clamp(17px,3.6vw,27px);text-shadow:0 1px 2px #9b5425}
.hash{font-size:clamp(14px,2.8vw,21px);font-weight:bold}
.table-info{font-weight:bold;text-align:center;font-size:clamp(10px,2.3vw,17px);line-height:1.05}.table-info b{display:block;margin-top:3px;font-size:1.1em}
.round{font-size:clamp(20px,4vw,31px)}
#table{position:relative;flex:1;min-height:0;overflow:hidden}
#center-art{position:absolute;width:53%;height:auto;left:50%;top:51%;transform:translate(-50%,-50%);z-index:1;pointer-events:none}
.player{position:absolute;width:17.5vw;max-width:142px;transform:translate(-50%,-50%);text-align:center;z-index:3}
.frame{width:100%;aspect-ratio:1/1;position:relative;padding:0;border-radius:12px;overflow:visible;
background:linear-gradient(145deg,#17202b,#070d17 50%,#283343);border:5px ridge #29313c;
box-shadow:0 2px 5px rgba(0,0,0,.5),inset 0 0 0 2px #69717a}
.frame img{display:block;width:100%;height:100%;object-fit:cover;border-radius:7px}
.corner{position:absolute;z-index:4;color:#f04a3f;-webkit-text-stroke:1px #e8b16a;text-shadow:0 1px 2px #151515;line-height:1}
.heart{}
.corner.heart{font-size:clamp(11px,2vw,17px)}.tl{left:-8px;top:-8px}.tr{right:-8px;top:-8px}
.corner.star{font-size:clamp(13px,2.2vw,18px)}.tc{left:50%;top:-10px;transform:translateX(-50%)}.bc{left:50%;bottom:-10px;transform:translateX(-50%)}
.count{position:absolute;right:-9px;top:-10px;z-index:6;min-width:31px;height:31px;padding:0 5px;border-radius:50%;
display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#ff6155,#e52c27 68%,#a91e1a);
border:2px solid #f4c28a;color:white;font-weight:bold;font-size:clamp(12px,3vw,19px);text-shadow:0 1px 2px #8d1717;box-shadow:0 2px 3px #6c321e}
.nick{font-size:clamp(9px,1.8vw,13px);line-height:1.05;margin-top:3px;white-space:nowrap;text-shadow:0 1px 2px #74401e}
#chat{flex:1;min-height:0;background:#f4f4f4;overflow:auto}#messages{padding:8px 12px}
#composer{height:5.3dvh;min-height:42px;max-height:54px;flex:none;background:white;border-top:1px solid #e5e5e5;display:flex;align-items:center;padding:0 3.5%;gap:8px}
#message{flex:1;min-width:0;border:0;outline:0;font-size:clamp(12px,2.1vw,15px);background:transparent;color:#333}
#message::placeholder{color:#bdbdbd}
#send{width:clamp(32px,5.5vw,42px);height:clamp(32px,5.5vw,42px);border:0;border-radius:50%;background:#f3b44e;color:white;font-size:20px;display:grid;place-items:center;flex:none}
@media(max-height:650px){#game{height:62dvh}.player{width:16vw}#center-art{width:48%}}
