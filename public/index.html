
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17120f">
<title>KissUZ 🍾</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#17120f;color:white;
 font-family:Arial,sans-serif;
}
header{
 height:60px;padding:0 17px;
 display:flex;align-items:center;
 justify-content:space-between;
 background:#241b15;
 border-bottom:1px solid #493426;
}
.logo{font-size:23px;font-weight:900;color:#f7c77c}
.icons{font-size:21px;display:flex;gap:18px}
main{max-width:480px;margin:auto;padding:12px}
.title{text-align:center;margin:10px 0 20px}
.title h2{font-size:21px;margin:0 0 6px}
.title p{font-size:12px;color:#b8a28c;margin:0}
.table{
 width:100%;aspect-ratio:1/1;
 position:relative;border-radius:50%;
 border:12px solid #56351f;
 background:
 repeating-linear-gradient(2deg,#81502e 0 10px,#a56e40 10px 19px,#774628 19px 28px);
 box-shadow:0 0 0 4px #bd925c,0 12px 25px #000a,inset 0 0 35px #281309;
}
.table:before{
 content:"";position:absolute;inset:12px;
 border:2px solid #f3c58b66;border-radius:50%;
}
.bottle{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%) rotate(-35deg);
 font-size:90px;z-index:2;
 filter:drop-shadow(0 8px 5px #0009);
}
.seat{
 position:absolute;transform:translate(-50%,-50%);
 display:flex;flex-direction:column;
 align-items:center;gap:4px;width:65px;
 z-index:3;
}
.avatar{
 width:53px;height:53px;border-radius:50%;
 background:linear-gradient(145deg,#586c78,#24313c);
 border:3px solid #e5bb79;
 display:flex;align-items:center;
 justify-content:center;font-size:25px;
 box-shadow:0 4px 8px #0009;
}
.name{
 background:#291d15;border:1px solid #bd925c;
 padding:4px 7px;border-radius:9px;
 font-size:10px;white-space:nowrap;
 max-width:78px;overflow:hidden;text-overflow:ellipsis;
}
.empty .avatar{
 background:#4a3829;
 border:2px dashed #e8bf83;
 color:#f5d8aa;
}
.empty .name{color:#f2d5a8}
.stats{display:flex;gap:8px;margin-top:20px}
.stat{
 flex:1;text-align:center;padding:13px 5px;
 background:#2a2019;border:1px solid #59432f;
 border-radius:13px;
}
.stat b{display:block;font-size:20px;color:#ffcc7b}
.stat small{color:#b8a38b;font-size:11px}
.panel{
 margin-top:15px;padding:16px;
 background:#292019;border:1px solid #59432f;
 border-radius:15px;
}
.panel h3{font-size:15px;margin:0 0 13px}
.row{
 display:flex;justify-content:space-between;
 font-size:13px;color:#c8b9a5;
}
button{
 width:100%;padding:15px;margin-top:11px;
 border:0;border-radius:12px;
 background:linear-gradient(135deg,#ffdc98,#d99a46);
 color:#34200c;font-weight:bold;font-size:15px;
}
.dark{background:#493729;color:white;border:1px solid #73553b}
.footer{text-align:center;color:#8e7b68;font-size:11px;padding:20px}
</style>
</head>
<body>

<header>
 <div class="logo">KissUZ 🍾</div>
 <div class="icons">♟　⚙　⋮</div>
</header>

<main>
 <div class="title">
  <h2>O‘yin stoli №1</h2>
  <p>Do‘stlaringni taklif qil va o‘yinni boshlang!</p>
 </div>

 <div class="table" id="table">
  <div class="bottle">🍾</div>
 </div>

 <div class="stats">
  <div class="stat"><b>12</b><small>Joylar</small></div>
  <div class="stat"><b id="count">0/12</b><small>O‘yinchilar</small></div>
  <div class="stat"><b>0</b><small>Raundlar</small></div>
 </div>

 <div class="panel">
  <h3>👥 O‘yinchilar</h3>
  <div class="row">
   <span>Stol holati</span>
   <span id="status">Bo‘sh</span>
  </div>
  <button>➕ Joy egallash</button>
  <button class="dark">🔗 Do‘stlarni taklif qilish</button>
 </div>

 <div class="panel">
  <h3>🍾 O‘yin boshqaruvi</h3>
  <button>AYLANTIRISH 🍾</button>
  <button class="dark">🔄 Qayta boshlash</button>
 </div>
</main>

<div class="footer">KissUZ © 2026</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

const table=document.getElementById("table");
const total=12;
const radius=40;

for(let i=0;i<total;i++){
 const angle=(i*2*Math.PI/total)-Math.PI/2;
 const x=50+radius*Math.cos(angle);
 const y=50+radius*Math.sin(angle);

 const seat=document.createElement("div");
 seat.className="seat empty";
 seat.style.left=x+"%";
 seat.style.top=y+"%";

 seat.innerHTML=`
  <div class="avatar">+</div>
  <div class="name">Bo‘sh joy</div>
 `;

 table.appendChild(seat);
}
</script>
</body>
</html>
