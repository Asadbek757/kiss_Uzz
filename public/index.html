
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17232f">
<title>KissUZ 🍾</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px 14px 30px;
 background:#17232f;color:white;
 font-family:Arial,sans-serif;
}
.header{
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:25px;
}
.logo{font-size:25px;font-weight:900;color:#ffc65b}
.online{background:#243b43;border-radius:20px;padding:8px 13px;font-size:12px;color:#68e6a5}
h2{text-align:center;font-size:22px;margin:10px 0 5px}
.subtitle{text-align:center;color:#91a3b4;font-size:13px}
.table-area{
 width:min(100%,390px);
 aspect-ratio:1;
 margin:30px auto 22px;
 position:relative;border-radius:50%;
 background:radial-gradient(circle,#28534b,#1e443d 65%,#142e2c);
 border:10px solid #70472f;
 box-shadow:0 0 0 5px #a87545,0 12px 30px #0008,inset 0 0 25px #0008;
}
.table-area:before{
 content:"";position:absolute;inset:9px;
 border:2px solid #ffffff18;border-radius:50%;
}
.center{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);
 width:115px;height:115px;
 display:flex;align-items:center;justify-content:center;
}
.bottle{
 font-size:77px;
 filter:drop-shadow(0 6px 5px #0008);
}
.player{
 position:absolute;width:70px;
 display:flex;flex-direction:column;
 align-items:center;gap:5px;
 transform:translate(-50%,-50%);
 z-index:2;
}
.avatar{
 width:53px;height:53px;border-radius:50%;
 background:linear-gradient(145deg,#435c75,#243747);
 border:3px solid #d5aa64;
 display:flex;align-items:center;justify-content:center;
 font-size:25px;box-shadow:0 4px 9px #0007;
}
.player-name{
 background:#14232d;border:1px solid #ffffff20;
 border-radius:12px;padding:4px 9px;
 font-size:11px;white-space:nowrap;
 max-width:90px;overflow:hidden;text-overflow:ellipsis;
}
.empty .avatar{
 border:2px dashed #8ca19d;
 background:#ffffff0a;color:#b4c4c0;
}
.empty .player-name{color:#a6b5b3}
.info{
 display:flex;justify-content:space-between;
 gap:10px;margin:15px 0;
}
.info-card{
 flex:1;background:#21313f;padding:13px 8px;
 border-radius:14px;text-align:center;
 border:1px solid #ffffff10;
}
.info-card b{
 display:block;font-size:20px;color:#ffc65b;
}
.info-card span{font-size:11px;color:#a6b5c5}
.section{
 background:#21313f;border:1px solid #ffffff12;
 border-radius:17px;padding:16px;margin-top:17px;
}
.section h3{margin:0 0 12px;font-size:15px}
.people{
 display:flex;justify-content:space-between;
 color:#aebbc7;font-size:13px;
}
.btn{
 width:100%;border:0;border-radius:14px;
 padding:16px;margin-top:12px;
 font-size:16px;font-weight:bold;
 background:linear-gradient(135deg,#ffda82,#eaa63e);
 color:#30200b;
}
.secondary{background:#344654;color:white;border:1px solid #ffffff15}
.footer{text-align:center;color:#718394;font-size:11px;margin-top:24px}
</style>
</head>

<body>

<div class="header">
 <div class="logo">🍾 KissUZ</div>
 <div class="online">● Online</div>
</div>

<h2>O‘yin stoli</h2>
<div class="subtitle">Do‘stlaring bilan qiziqarli vaqt o‘tkaz!</div>

<div class="table-area" id="table">
 <div class="center">
  <div class="bottle">🍾</div>
 </div>
</div>

<div class="info">
 <div class="info-card">
  <b>12</b><span>Maksimal joy</span>
 </div>
 <div class="info-card">
  <b id="playerCount">0/12</b><span>O‘yinchilar</span>
 </div>
 <div class="info-card">
  <b>0</b><span>Raundlar</span>
 </div>
</div>

<div class="section">
 <h3>👥 O‘yinchilar</h3>
 <div class="people">
  <span>Stoldagi o‘yinchilar</span>
  <span id="playerText">0 / 12</span>
 </div>
 <button class="btn">➕ Joy egallash</button>
 <button class="btn secondary">🚪 Stolni tark etish</button>
</div>

<div class="section">
 <h3>🍾 O‘yin boshqaruvi</h3>
 <button class="btn">🍾 Aylantirish</button>
 <button class="btn secondary">🔄 Qayta boshlash</button>
</div>

<div class="footer">KissUZ © 2026</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){
 tg.ready();
 tg.expand();
}

const table=document.getElementById("table");

const count=12;
const radius=39;

for(let i=0;i<count;i++){
 const angle=(i*2*Math.PI/count)-Math.PI/2;

 const x=50+radius*Math.cos(angle);
 const y=50+radius*Math.sin(angle);

 const player=document.createElement("div");
 player.className="player empty";

 player.style.left=x+"%";
 player.style.top=y+"%";

 player.innerHTML=`
  <div class="avatar">+</div>
  <div class="player-name">Bo‘sh joy</div>
 `;

 table.appendChild(player);
}
</script>

</body>
</html>
